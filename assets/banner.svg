<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="zdownloader3 terminal">
  <defs>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="#0d0d0d"/>

  <!-- left: mark + wordmark -->
  <g transform="translate(48,88)" stroke="#f5efe8" fill="none" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="46" cy="46" r="38"/>
    <ellipse cx="46" cy="46" rx="16.5" ry="38"/>
    <line x1="8" y1="46" x2="84" y2="46" stroke-width="4.5"/>
    <path d="M14.5 24.5 Q46 46 77.5 24.5"/>
    <path d="M14.5 67.5 Q46 46 77.5 67.5"/>
  </g>
  <text x="196" y="122" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="40" font-weight="700" fill="#f5efe8">zDownloader<tspan baseline-shift="super" font-size="0.5em" fill="#e8b23e">3</tspan></text>
  <text x="196" y="152" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#a89a85">JD2-shaped downloads for Linux</text>

  <!-- right: terminal pane -->
  <rect x="640" y="44" width="592" height="272" rx="14" fill="url(#pane)" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="664" cy="64" r="5.5" fill="#e8613c"/>
  <circle cx="682" cy="64" r="5.5" fill="#e8b23e"/>
  <circle cx="700" cy="64" r="5.5" fill="#4fd07d"/>
  <text x="720" y="70" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#8a8a8a">zdownloader3 — zsh</text>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#e8b23e">
    <text x="664" y="108"><tspan fill="#a89a85">$</tspan> zdownloader3</text>
  </g>
  <text x="664" y="133" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#f5efe8">adding 5 links…</text>
  <text x="664" y="153" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#f5efe8"><tspan fill="#a89a85">  [check]</tspan> thesis.pdf <tspan fill="#8a8a8a">· 88 MB · mirror.example.com</tspan></text>
  <text x="664" y="173" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#f5efe8"><tspan fill="#a89a85">  [check]</tspan> appendix.pdf <tspan fill="#8a8a8a">· 4 MB</tspan></text>
  <text x="664" y="193" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#f5efe8"><tspan fill="#a89a85">  [grab ]</tspan> Documents (2 files)</text>
  <text x="664" y="213" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#f5efe8"><tspan fill="#a89a85">  [grab ]</tspan> Videos (3 files)</text>

  <text x="664" y="250" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#f5efe8"><tspan fill="#a89a85">  [done ]</tspan> thesis.pdf <tspan fill="#4fd07d">✓</tspan></text>
</svg>
