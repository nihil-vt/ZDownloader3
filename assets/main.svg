<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="zDownloader³ main window mockup">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f6f1e8" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f3a56"/>
      <stop offset="1" stop-color="#1f2a44"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8ee"/>
      <stop offset="1" stop-color="#f1e7d4"/>
    </linearGradient>
  </defs>

  <!-- window chrome -->
  <rect width="960" height="560" rx="22" fill="url(#soft)"/>
  <rect x="1" y="1" width="958" height="558" rx="21" fill="none" stroke="#e4d8c8" stroke-width="2"/>
  <path d="M24 26h16a6 6 0 0 1 6 6v30a6 6 0 0 1-6 6H24a6 6 0 0 1-6-6V32a6 6 0 0 1 6-6z" fill="#ffd166" opacity="0.9"/>
  <text x="54" y="44" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#25211e">The big download</text>
  <circle cx="934" cy="36" r="6" fill="#e0d2c0"/>
  <circle cx="908" cy="36" r="6" fill="#e0d2c0"/>
  <circle cx="882" cy="36" r="6" fill="#e0d2c0"/>

  <!-- tabs -->
  <rect x="24" y="72" width="420" height="34" rx="10" fill="#e2d7c4"/>
  <rect x="28" y="75" width="200" height="28" rx="8" fill="#25211e"/>
  <text x="128" y="94" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffd166" text-anchor="middle">Downloads</text>
  <text x="324" y="94" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#6b6256" text-anchor="middle">Linkgrabber</text>

  <!-- toolbar icons (round, chunky) -->
  <g fill="#25211e">
    <circle cx="56" cy="130" r="16" fill="#2f3a56"/><path d="M49 130h14M56 123v14" stroke="#ffd166" stroke-width="3.3" stroke-linecap="round"/>
    <circle cx="106" cy="130" r="16" fill="#2f3a56"/><path d="M99 130h14M106 123v14" stroke="#ffd166" stroke-width="3.3" stroke-linecap="round"/>
    <circle cx="156" cy="130" r="16" fill="#c98a2c"/><path d="M150 130h12" stroke="#1a1206" stroke-width="3.3" stroke-linecap="round"/>
    <circle cx="206" cy="130" r="16" fill="#2f3a56"/><path d="M199 124v12M199 130h14" stroke="#ffd166" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="256" cy="130" r="16" fill="#2f3a56"/><path d="M250 124v12M250 130h12" stroke="#ffd166" stroke-width="3.3" stroke-linecap="round"/>
  </g>

  <!-- list header -->
  <rect x="24" y="164" width="912" height="26" fill="#e7deca"/>
  <text x="36"  y="182" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#6b6256">NAME</text>
  <text x="500" y="182" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#6b6256">SIZE</text>
  <text x="612" y="182" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#6b6256">SPEED</text>
  <text x="760" y="182" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#6b6256">STATUS</text>

  <!-- package rows + link rows -->
  <rect x="24" y="190" width="912" height="34" fill="#f4efe6"/>
  <rect x="38" y="199" width="16" height="16" rx="4" fill="#c98a2c"/>
  <text x="64" y="211" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#25211e">Documents</text>
  <text x="500" y="211" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#25211e">2.1 GB</text>
  <text x="612" y="211" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#25211e">12.5 MB/s</text>
  <text x="760" y="211" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#8a5a0a">Downloading</text>

  <rect x="24" y="224" width="912" height="34" fill="#fffdf8"/>
  <rect x="74" y="233" width="14" height="14" rx="3" fill="#ffd166"/>
  <text x="94" y="245" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#25211e">thesis.pdf</text>
  <text x="500" y="245" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#25211e">88.4 MB</text>
  <text x="612" y="245" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#25211e">6.2 MB/s</text>
  <text x="760" y="245" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#8a5a0a">72%</text>

  <rect x="24" y="258" width="912" height="34" fill="#f4efe6"/>
  <rect x="74" y="267" width="14" height="14" rx="3" fill="#e7deca"/>
  <text x="94" y="279" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6b6256">appendix-b.pdf</text>
  <text x="500" y="279" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6b6256">3.9 MB</text>
  <text x="612" y="279" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6b6256">—</text>
  <text x="760" y="279" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6b6256">Queued</text>

  <rect x="24" y="292" width="912" height="34" fill="#fffdf8"/>
  <rect x="38" y="301" width="16" height="16" rx="4" fill="#c98a2c" opacity="0.7"/>
  <text x="64" y="313" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#25211e">Videos</text>
  <text x="500" y="313" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#25211e">4.7 GB</text>
  <text x="612" y="313" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#25211e">18.1 MB/s</text>
  <text x="760" y="313" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#31845a">Done</text>

  <!-- dock: overview -->
  <rect x="24" y="338" width="440" height="160" rx="14" fill="#f4efe6" stroke="#e0d5c6" stroke-width="2"/>
  <text x="40" y="362" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="800" fill="#25211e">Download Overview</text>
  <text x="40" y="388" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#6b6256">Running</text>
  <text x="270" y="388" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#25211e">1 / 3</text>
  <text x="40" y="410" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#6b6256">Total size</text>
  <text x="270" y="410" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#25211e">6.8 GB</text>
  <text x="40" y="432" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#6b6256">Remaining</text>
  <text x="270" y="432" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#25211e">2.1 GB</text>
  <text x="40" y="454" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#6b6256">Speed</text>
  <text x="270" y="454" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#c98a2c">12.5 MB/s</text>
  <text x="40" y="476" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#6b6256">ETA</text>
  <text x="270" y="476" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#25211e">2 min 47 s</text>

  <!-- dock: properties -->
  <rect x="480" y="338" width="456" height="160" rx="14" fill="#fffdf8" stroke="#e0d5c6" stroke-width="2"/>
  <text x="496" y="362" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="800" fill="#25211e">File Properties</text>
  <text x="496" y="388" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6b6256">File name</text>
  <text x="600" y="388" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#25211e">thesis.pdf</text>
  <text x="496" y="408" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6b6256">From</text>
  <text x="600" y="408" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#25211e">mirror.example.com</text>
  <text x="496" y="428" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6b6256">Save to</text>
  <text x="600" y="428" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#25211e">~/Downloads</text>
  <text x="496" y="448" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6b6256">Status</text>
  <text x="600" y="448" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#8a5a0a">Downloading — 72%</text>
  <text x="496" y="468" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6b6256">Checksum</text>
  <text x="600" y="468" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#25211e">SHA1 pending…</text>
</svg>
