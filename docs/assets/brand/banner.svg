<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="zDownloader³ — JDownloader2-shaped downloads for the Linux desktop">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1730"/>
      <stop offset="1" stop-color="#23304e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="zdrop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ffb703"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#sky)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- fork mark, large -->
  <g transform="translate(56, 56)">
    <path fill="#1f2a44" d="M28 0h152a16 16 0 0 1 16 16v152a16 16 0 0 1-16 16H28a16 16 0 0 1-16-16V16A16 16 0 0 1 28 0z"/>
    <path fill="url(#badge)" d="M104 42 L150 96 L128 96 L128 150 L104 128 L80 150 L80 96 L58 96 Z" opacity="0.9"/>
    <path fill="url(#zdrop)" d="M76 66 L148 66 L148 76 L110 76 L148 112 L76 112 L76 103 L111 103 L76 103 Z" transform="translate(0,-4)"/>
  </g>

  <!-- wordmark -->
  <text x="290" y="128" fill="#f8f9fa" font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">ZDownloader<tspan fill="#ffd166">3</tspan></text>
  <text x="290" y="172" fill="#c7cdd8" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500">JDownloader2-driven downloads, native to the Linux desktop.</text>

  <!-- callouts -->
  <g font-family="Inter, system-ui, sans-serif" font-size="20" fill="#ffe3a1">
    <text x="290" y="232">▼  fast engine</text>
    <text x="490" y="232">▼  JD2 link grabber</text>
    <text x="740" y="232">▼  packagizer rules</text>
  </g>
</svg>
